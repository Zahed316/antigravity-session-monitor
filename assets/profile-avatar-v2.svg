<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="v2-title v2-desc">
  <title id="v2-title">Zahed-r Cybernetic Z Avatar</title>
  <desc id="v2-desc">Futuristic cybernetic monogram Z fused with an orbital gravity well and live telemetry pulse</desc>
  <defs>
    <!-- Deep Space Gradient Background (Full Bleed for Universal Profile Cropping) -->
    <radialGradient id="v2-bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#151b3b" />
      <stop offset="45%" stop-color="#0c1024" />
      <stop offset="100%" stop-color="#04060f" />
    </radialGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="v2-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#7000ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Z Monogram Gradients -->
    <linearGradient id="v2-z-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <linearGradient id="v2-pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="v2-orbit-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1" />
    </linearGradient>

    <!-- Gold Accent Satellite -->
    <radialGradient id="v2-gold-sat" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffd000" />
      <stop offset="70%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff4800" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="v2-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="v2-glow-intense" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background with corner rounding for squircle platforms -->
  <rect width="512" height="512" rx="100" fill="url(#v2-bg-grad)" />

  <!-- Subtle Circular HUD Boundary (safe area for round avatar crops) -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="242" fill="none" stroke="#7000ff" stroke-width="1" stroke-opacity="0.15" />

  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#v2-core-glow)" />

  <!-- Diagonal Cosmic Axis Rings (Antigravity Gyroscope) -->
  <g transform="rotate(35 256 256)">
    <ellipse cx="256" cy="256" rx="180" ry="58" fill="none" stroke="url(#v2-orbit-cyan)" stroke-width="4" stroke-dasharray="140 30 60 40" opacity="0.6" />
    <circle cx="436" cy="256" r="4.5" fill="#00f2fe" filter="url(#v2-glow)" />
  </g>
  <g transform="rotate(-35 256 256)">
    <ellipse cx="256" cy="256" rx="180" ry="58" fill="none" stroke="url(#v2-z-grad)" stroke-width="4" stroke-dasharray="200 40" opacity="0.5" />
    <circle cx="76" cy="256" r="4.5" fill="#e100ff" filter="url(#v2-glow)" />
  </g>

  <!-- High-Tech Coordinate / Telemetry Lines -->
  <g stroke="#4facfe" stroke-width="1" opacity="0.2">
    <line x1="120" y1="256" x2="160" y2="256" />
    <line x1="352" y1="256" x2="392" y2="256" />
    <line x1="256" y1="120" x2="256" y2="160" />
    <line x1="256" y1="352" x2="256" y2="392" />
  </g>

  <!-- ================= MONOGRAM 'Z' SHAPE ================= -->
  <!-- Outer Glow of the Z -->
  <g filter="url(#v2-glow)" opacity="0.75">
    <path d="M 148,160 
             L 364,160 
             L 336,198 
             L 248,314 
             L 364,314 
             L 348,352 
             L 148,352 
             L 176,314 
             L 264,198 
             L 148,198 
             Z" 
          fill="url(#v2-z-grad)" />
  </g>

  <!-- Sharp Main Z Body -->
  <path d="M 148,160 
           L 364,160 
           L 336,198 
           L 248,314 
           L 364,314 
           L 348,352 
           L 148,352 
           L 176,314 
           L 264,198 
           L 148,198 
           Z" 
        fill="url(#v2-z-grad)" />

  <!-- Inner Cybernetic Inset Lines / Facets -->
  <path d="M 170,178 L 334,178" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 314,212 L 204,334" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 178,334 L 324,334" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- ================= VITAL PULSE CUTTING THROUGH Z ================= -->
  <!-- Horizontal Pulse Wave piercing through the Z monogram -->
  <g filter="url(#v2-glow-intense)">
    <path d="M 52,256 
             L 174,256 
             L 194,220 
             L 218,292 
             L 244,164 
             L 272,348 
             L 298,212 
             L 318,276 
             L 338,256 
             L 460,256" 
          fill="none" 
          stroke="url(#v2-pulse-grad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <path d="M 52,256 
           L 174,256 
           L 194,220 
           L 218,292 
           L 244,164 
           L 272,348 
           L 298,212 
           L 318,276 
           L 338,256 
           L 460,256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Pulse Center Singularity Node -->
  <circle cx="256" cy="256" r="16" fill="#04060f" stroke="#00f2fe" stroke-width="3" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#v2-glow)" />

  <!-- Active Amber Satellite Beacon (Floating at top-right orbit) -->
  <g transform="translate(390, 134)">
    <circle cx="0" cy="0" r="34" fill="url(#v2-gold-sat)" opacity="0.45" />
    <circle cx="0" cy="0" r="14" fill="#ffd000" filter="url(#v2-glow)" />
    <circle cx="-3" cy="-3" r="5" fill="#ffffff" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ffd000" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  </g>

  <!-- Publisher Badge Label: Zahed-r Telemetry Marker -->
  <g opacity="0.6">
    <circle cx="106" cy="116" r="3" fill="#00f2fe" />
    <line x1="114" y1="116" x2="160" y2="116" stroke="#4facfe" stroke-width="1" />
    <text x="168" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4facfe" letter-spacing="2">ZAHED-R</text>
  </g>
</svg>
