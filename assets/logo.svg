<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="gw-title gw-desc">
  <title id="gw-title">GravityWatch</title>
  <desc id="gw-desc">Orbit rings around a heartbeat pulse line with a bright satellite dot, on a deep-space navy rounded square</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141D40"/>
      <stop offset="1" stop-color="#090D1F"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FB0FF"/>
      <stop offset="1" stop-color="#4C6FFF"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BC8FF"/>
      <stop offset="1" stop-color="#4FF0D2"/>
    </linearGradient>
    <radialGradient id="dotglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC24B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC24B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg)"/>

  <!-- gravity well: orbit rings -->
  <ellipse cx="128" cy="138" rx="86" ry="32" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.38"/>
  <ellipse cx="128" cy="138" rx="60" ry="22" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.65"/>
  <ellipse cx="128" cy="138" rx="34" ry="13" fill="none" stroke="url(#ring)" stroke-width="9" opacity="0.95"/>

  <!-- satellite being watched -->
  <circle cx="184" cy="111" r="26" fill="url(#dotglow)"/>
  <circle cx="184" cy="111" r="13" fill="#FFC24B"/>

  <!-- live pulse (the "watch") -->
  <polyline points="22,138 88,138 100,112 116,164 128,138 234,138"
            fill="none" stroke="url(#pulse)" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
